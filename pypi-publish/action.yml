name: Publish to PyPI
description: Verify the annotated release tag and notes, build without local sources, and trusted-publish to PyPI.
inputs:
  working-directory:
    description: Folder holding the package's pyproject.toml, relative to the repository root. Release notes are always read from the root.
    required: false
    default: .
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: false
    # uv --no-config can pick a newer interpreter than the pinned one, so name it explicitly.
    # A generated package without its own .python-version uses the repository root's.
    - name: Use the interpreter in .python-version
      shell: bash
      env:
        PACKAGE_DIR: ${{ inputs.working-directory }}
      run: |
        for file in "$PACKAGE_DIR/.python-version" .python-version; do
          if [ -s "$file" ]; then echo "UV_PYTHON=$(head -n1 "$file")" >> "$GITHUB_ENV"; break; fi
        done
    - name: Verify release tag
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PACKAGE_DIR: ${{ inputs.working-directory }}
      run: VERSION=$(cd "$PACKAGE_DIR" && uv --no-config version --short) "$GITHUB_ACTION_PATH/../verify-release-tag/verify.sh"
    - name: Build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv --no-config build --no-sources
    # --check-url skips files PyPI already has and fails on a same-named file with different
    # contents, so rerunning after a partial upload finishes it.
    - name: Publish
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
