name: Publish to PyPI
description: Verify the annotated release tag and notes, build without local sources, and trusted-publish to PyPI.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: false
    - name: Verify release tag
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: VERSION=$(uv --no-config version --short) "$GITHUB_ACTION_PATH/../verify-release-tag/verify.sh"
    - name: Build
      shell: bash
      run: uv --no-config build --no-sources
    - name: Publish
      shell: bash
      run: uv publish --trusted-publishing always
